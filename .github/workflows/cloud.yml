name: build karaoke-cloud image
on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/cloud.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cloud
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/karaoke-cloud:latest
            ghcr.io/${{ github.repository_owner }}/karaoke-cloud:${{ github.sha }}
